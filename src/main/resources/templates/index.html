<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="layout :: head(title='Home')"></th:block>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="layout :: navbar"></div>

<div class="highlighted-movie">
  <img th:src="'https://image.tmdb.org/t/p/w500' + ${highlightMovie.backdrop_path}"
       class="banner-img" alt="Banner Movie">
  <div class="highlight-overlay">
    <h1 th:text="${highlightMovie.title}">Movie Title</h1>
    <p th:text="${highlightMovie.overview}">Movie Overview goes here. This is a brief description that will be truncated if too long.</p>
    <a th:href="@{'/movie/' + ${highlightMovie.id}}" class="btn btn-warning btn-lg">View Details</a>
  </div>
</div>

<div class="container my-4">
  <h3 class="section-title">Trending Movies</h3>
  <div class="movie-list">
    <div class="card" th:each="movie : ${trendingMovies}">
      <img th:src="'https://image.tmdb.org/t/p/w500' + ${movie.poster_path}" class="card-img-top" alt="Movie Poster">
      <div class="card-body">
        <h5 class="card-title" th:text="${movie.title}">Movie Title</h5>
        <p class="card-text" th:text="${movie.overview}">Movie Overview</p>
        <div class="card-buttons">
          <a th:href="@{'/movie/' + ${movie.id}}" class="btn btn-primary btn-sm">Details</a>
          <form th:action="@{'/favorites/add/' + ${movie.id}}" method="post">
            <button type="submit" class="btn btn-success btn-sm">Add to Favorites</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Footer Fragment -->
<div th:replace="layout :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
