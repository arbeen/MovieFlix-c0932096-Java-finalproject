<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="layout :: head(title='Trending Movies')"></th:block>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<div th:replace="layout :: navbar"></div>

<!-- Page Content -->
<div class="container my-5">
    <h2 class="section-title text-center mb-5">🔥 Trending Movies</h2>
    <form th:action="@{/search}" method="get" class="mb-5 w-50 mx-auto">
        <div class="input-group">
            <input type="text" name="query" class="form-control" placeholder="Search movies..." required>
            <button class="btn btn-outline-light" type="submit">Search</button>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(movies)}" class="text-center text-light mt-4">
        <p>No movies found. Try a different search.</p>
    </div>

    <div class="row g-4">
        <div class="col-md-3 col-sm-6" th:each="movie : ${movies}">
            <div class="card movie-card h-100 shadow-sm">
                <img th:src="'https://image.tmdb.org/t/p/w500' + ${movie.poster_path}" class="card-img-top movie-poster" alt="Movie Poster">

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-light" th:text="${movie.title}">Movie Title</h5>
                    <p class="card-text text-truncate-3 text-light" th:text="${movie.overview}">Overview</p>

                    <div class="card-buttons">
                        <a th:href="@{'/movie/' + ${movie.id}}" class="btn btn-warning btn-sm">Details</a>
                        <form th:action="@{'/favorites/add/' + ${movie.id}}" method="post">
                            <button type="submit" class="btn btn-success btn-sm">Add to Favorites</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="layout :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
