<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="layout :: head(title=${movie.title})"></th:block>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar Fragment -->
<div th:replace="layout :: navbar"></div>

<!-- Movie Details -->
<div class="container my-5">
    <h1 class="section-title text-center mb-5" th:text="${movie.title}">Movie Title</h1>

    <div class="row justify-content-center align-items-start g-4">
        <!-- Poster -->
        <div class="col-md-4 text-center">
            <img th:src="'https://image.tmdb.org/t/p/w500' + ${movie.poster_path}"
                 alt="Movie Poster"
                 class="img-fluid rounded movie-detail-poster">
        </div>

        <!-- Details -->
        <div class="col-md-6">
            <div class="bg-dark p-4 rounded shadow-sm movie-info">
                <h3 class="text-warning mb-3" th:text="${movie.title}">Movie Title</h3>
                <p class="text-light mb-3" th:text="${movie.overview}">Movie overview</p>

                <ul class="list-unstyled text-light">
                    <li><strong>Release Date:</strong> <span th:text="${movie.release_date}">2025-01-01</span></li>
                    <li><strong>Rating:</strong> <span th:text="${movie.vote_average}">8.2</span></li>
                </ul>

                <div class="d-flex flex-wrap gap-3 mt-4">
                    <a th:href="@{'/movie'}" class="btn btn-warning">⬅ Back to Movies</a>

                    <form th:action="@{'/favorites/add/' + ${movie.id}}" method="post">
                        <button type="submit" class="btn btn-success">❤️ Add to Favorites</button>
                    </form>

<!--                    <a th:href="@{'/favorites/remove/' + ${movie.id}}" class="btn btn-danger">🗑 Remove from Favorites</a>-->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer Fragment -->
<div th:replace="layout :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
