<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="layout :: head(title='Favorites')"></th:block>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar Fragment -->
<div th:replace="layout :: navbar"></div>

<!-- Favorites Section -->
<div class="container my-5">
    <h2 class="section-title text-center mb-4">❤️ Your Favorite Movies</h2>

    <div th:if="${#lists.isEmpty(favorites)}" class="text-center text-light">
        <p class="lead">You haven't added any favorite movies yet.</p>
        <a th:href="@{'/movie'}" class="btn btn-warning">Start Browsing</a>
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(favorites)}">
        <div class="col-md-3 col-sm-6" th:each="movie : ${favorites}">
            <div class="card movie-card h-100 shadow-sm">
                <img th:src="'https://image.tmdb.org/t/p/w500' + ${movie.poster_path}" class="card-img-top movie-poster" alt="Movie Poster">

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-light" th:text="${movie.title}">Movie Title</h5>
                    <p class="card-text text-truncate-3 text-light" th:text="${movie.overview}">Overview</p>

                    <div class="mt-auto d-grid gap-2">
                        <a th:href="@{'/movie/' + ${movie.id}}" class="btn btn-primary btn-sm">View Details</a>
                        <a th:href="@{'/favorites/remove/' + ${movie.id}}" class="btn btn-danger btn-sm">Remove</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer Fragment -->
<div th:replace="layout :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
